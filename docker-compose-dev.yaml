services:
  gayadi-be:
    image: gayadi-cr.kr.ncr.ntruss.com/gayadi-be-dev:latest
    container_name: gayadi-be-container
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - ./.env.dev

    volumes:
      - ./secrets:/run/secrets:ro

    networks:
      - gayadi-network

networks:
  gayadi-network:
    external: true
