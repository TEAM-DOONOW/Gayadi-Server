version: 2

# GitHub Dependabot이 새 버전과 보안 업데이트를 확인해 PR을 생성합니다.
# 업데이트를 자동 병합하거나 배포하지 않으며, 생성된 PR은 CI 통과 후 개발자가 검토합니다.
updates:
  # Spring Boot와 프로젝트에서 사용하는 Gradle 의존성을 매주 확인합니다.
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # checkout, setup-java, CodeQL 등 GitHub Actions 버전을 매주 확인합니다.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
