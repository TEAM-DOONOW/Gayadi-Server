name: ncp-ci

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      REGISTRY: ${{ secrets.NCP_REGISTRY }}
      IMAGE_NAME: gayadi-be
      IMAGE: ${{ secrets.NCP_REGISTRY }}/gayadi-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 일단 로컬에만 빌드
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TEAM=${{ github.repository_owner }}

      # 2. Registry에 올리기 전에 취약점 검사 (Trivy scan -> 취약점 발견 시 실패 (보안 게이트 역할)) - HIGH 제외
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@main

      - name: Run Trivy vulnerability scan
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      # 3. NCP Container Registry 로그인
      - name: Login to NCP Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}

      # 4. immutable SHA tag push
      - name: Push SHA image
        run: |
          docker push ${{ env.IMAGE }}:sha-${{ github.sha }}

      # latest / run number도 동일 이미지에 tag
      - name: Push additional tags
        run: |
          docker tag \
            ${{ env.IMAGE }}:sha-${{ github.sha }} \
            ${{ env.IMAGE }}:latest

          docker tag \
            ${{ env.IMAGE }}:sha-${{ github.sha }} \
            ${{ env.IMAGE }}:${{ github.run_number }}

          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.run_number }}

      # 5. SBOM 생성(# CycloneDX 포맷)
      - name: Generate SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom.json \
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      # 6. Cosign 설치
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # digest 조회
      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            ${{ env.IMAGE }}:sha-${{ github.sha }} \
            | cut -d@ -f2)

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 7. 이미지 서명 (keyless)
      - name: Sign Container Image
        run: |
          cosign sign --yes \
            ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}

      # 8. SBOM attestation
      # SBOM attestation을 이미지 digest에 연결
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.json \
            --type cyclonedx \
            ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}

      # NCP SourceDeploy API를 직접 호출
      - name: Trigger NCP SourceDeploy
        env:
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}

          PROJECT_ID: ${{ secrets.NCP_SOURCEDEPLOY_PROJECT_ID }}
          STAGE_ID: ${{ secrets.NCP_SOURCEDEPLOY_STAGE_ID }}
          SCENARIO_ID: ${{ secrets.NCP_SOURCEDEPLOY_SCENARIO_ID }}

        run: |
          METHOD="POST"
          URI="/api/v1/project/${PROJECT_ID}/stage/${STAGE_ID}/scenario/${SCENARIO_ID}/deploy"

          TIMESTAMP=$(date +%s%3N)

          MESSAGE="${METHOD} ${URI}
          ${TIMESTAMP}
          ${NCP_ACCESS_KEY}"

          SIGNATURE=$(printf "%s" "${MESSAGE}" \
            | openssl dgst -sha256 -hmac "${NCP_SECRET_KEY}" -binary \
            | openssl base64 -A)

          curl --fail-with-body \
            -X POST \
            "https://vpcsourcedeploy.apigw.ntruss.com${URI}" \
            -H "x-ncp-apigw-timestamp: ${TIMESTAMP}" \
            -H "x-ncp-iam-access-key: ${NCP_ACCESS_KEY}" \
            -H "x-ncp-apigw-signature-v2: ${SIGNATURE}" \
            -H "Content-Type: application/json"
