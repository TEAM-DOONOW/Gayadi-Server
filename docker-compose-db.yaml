services:
  postgres:
    image: postgres:16
    container_name: gayadi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets:/run/secrets:ro

    networks:
      - gayadi-network


  redis:
    image: redis:7-alpine
    container_name: gayadi-redis
    restart: unless-stopped

    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}

    command:
      - /bin/sh
      - -c
      - |
        umask 077
        mkdir -p /run/redis

        REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"

        printf 'user default off\nuser %s on >%s ~* +@all\n' \
          "$$REDIS_USERNAME" \
          "$$REDIS_PASSWORD" \
          > /run/redis/users.acl

        unset REDIS_PASSWORD

        exec redis-server \
          --aclfile /run/redis/users.acl \
          --appendonly yes

    volumes:
      - redis-data:/data
      - ./secrets:/run/secrets:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --user \"$${REDIS_USERNAME}\" ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - gayadi-network


volumes:
  postgres-data:
  redis-data:


networks:
  gayadi-network:
    external: true