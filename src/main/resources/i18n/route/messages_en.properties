# Validation messages will be added here during the DTO migration.

# Calculation
error.route.type-required=Select a route type.
error.route.type-invalid=The route type is invalid.
error.route.type-mismatch=The route type does not match the recommended route.
error.route.meeting-place-required=A meeting place has not been set.
error.route.member-required=A participant ID is required for an individual route.
error.route.departure-place-required=A departure place has not been set.
error.route.return-place-required=A return place has not been set.
error.route.itinerary-too-large=Routes can be calculated for up to 100 scheduled places.
error.route.plan-required=An itinerary is required before calculating routes.
error.route.stops-insufficient=At least two scheduled places are required to calculate a route.
error.route.calculation-changed=The itinerary or participant information changed during calculation. Please try again.
error.route.place-not-found=A place required for the route was not found.

# Selection
error.route.option-required=Provide a route ID or option value to select.
error.route.option-invalid=Provide an option value that matches the route type.
error.route.recommendation-not-found=Recommended route not found.
error.route.selectable-not-found=No selectable route was found. Request new route recommendations.
error.route.selection-forbidden=You can only select your own route.
error.route.access-forbidden=You can only view or change your own route.
error.route.not-selectable=This route can no longer be selected.
error.route.group-member-forbidden=Request the trip-wide route without a participant ID.
error.route.member-not-found=Trip participant not found.
error.route.member-data-missing=Participant information for the route was not found.

# Provider & TMAP
error.route.provider-failed=The route provider returned an invalid result.
error.route.tmap-not-configured=The TMAP transit API is not configured.
error.route.tmap-request-failed=The TMAP transit API request failed.
error.route.tmap-auth-failed=TMAP transit API authentication failed.
error.route.tmap-rate-limited=The TMAP transit API rate limit was exceeded.
error.route.tmap-response-invalid=The TMAP transit API returned an invalid response.
error.route.tmap-route-unavailable=No available TMAP transit route was found.
