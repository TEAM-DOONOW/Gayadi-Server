# Validation messages will be added here during the DTO migration.

# Request
error.weather.base-pair-required=baseDate and baseTime must be provided together.
error.weather.base-datetime-invalid=baseDate must use YYYYMMDD and baseTime must use HHMM format.
error.weather.base-time-unavailable=The publication time is not available for the selected forecast type.
error.weather.request-invalid=The weather request is invalid.
error.weather.required-parameter-missing=A required weather parameter is missing.
error.weather.location-pair-required=Provide both lat/lon or both nx/ny values.
error.weather.location-type-conflict=Use either lat/lon or nx/ny, not both.
error.weather.grid-out-of-range=The weather grid must be within nx 1-149 and ny 1-253.
error.weather.coordinate-out-of-range=Latitude must be -90 to 90 and longitude must be -180 to 180.
error.weather.location-unsupported=Enter a location in Korea supported by the short-range forecast service.
error.weather.location-required=Location information is required. Provide lat/lon or nx/ny.
error.weather.version-file-type-invalid=ftype must be one of ODAM, VSRT, or SHRT.
error.weather.version-datetime-invalid=baseDateTime must be a valid YYYYMMDDHHMM value.

# External API
error.weather.api-interrupted=The Korea Meteorological Administration API request was interrupted.
error.weather.api-failed=The Korea Meteorological Administration API request failed.
error.weather.api-rate-limited=The weather API rate limit was exceeded. Please try again later.
error.weather.api-response-invalid=The weather API returned an invalid response.
error.weather.api-auth-failed=Weather API authentication failed.
error.weather.api-not-configured=The weather API is not configured.
error.weather.data-not-found=No weather data is available for this time. Check the publication time.
