# Data & Security
error.common.data-conflict=이미 사용 중인 값이거나 다른 데이터와 연결되어 있어 처리할 수 없습니다.
error.common.unauthenticated=로그인이 필요합니다.
error.common.access-denied=요청을 처리할 권한이 없습니다.
error.common.internal-server-error=서버 내부 오류가 발생했습니다.
