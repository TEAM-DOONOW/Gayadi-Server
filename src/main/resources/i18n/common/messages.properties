error.common.invalid-date=실제로 존재하는 {0}를 입력해 주세요.
error.common.invalid-time=실제로 존재하는 {0}을 입력해 주세요.

# HTTP Protocol
error.common.resource-not-found=요청한 API 경로를 찾을 수 없습니다.
error.common.method-not-allowed=지원하지 않는 HTTP 메서드입니다.
error.common.not-acceptable=요청한 응답 형식을 제공할 수 없습니다.
