plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.gayadi'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.apache.logging.log4j:log4j-api:2.25.5'
        force 'tools.jackson.core:jackson-databind:3.1.5'
        force 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
        force 'org.apache.httpcomponents.client5:httpclient5:5.6.3'
        force 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
        force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
        eachDependency { details ->
            if (details.requested.group == 'io.netty') {
                details.useVersion '4.2.17.Final'
                details.because 'Netty security advisories through 4.2.16.Final'
            }
        }
    }
}

ext {
    set('springAiVersion', '2.0.0')
    set('tomcat.version', '11.0.25')
}

dependencyManagement {
    dependencies {
        dependency 'org.apache.logging.log4j:log4j-api:2.25.5'
        dependency 'tools.jackson.core:jackson-databind:3.1.5'
        dependency 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
        dependency 'org.apache.httpcomponents.client5:httpclient5:5.6.3'
        dependency 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
        dependency 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    }
}

dependencies {
    implementation enforcedPlatform('io.netty:netty-bom:4.2.17.Final')
    implementation enforcedPlatform('tools.jackson:jackson-bom:3.1.5')
    implementation enforcedPlatform('com.fasterxml.jackson:jackson-bom:2.21.5')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.google.api-client:google-api-client-gson:2.7.1'

    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation('org.springframework.ai:spring-ai-starter-model-openai') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    implementation 'org.springframework.ai:spring-ai-vector-store'
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    constraints {
        implementation 'org.apache.logging.log4j:log4j-api:2.25.5'
        implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.3'
        implementation 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
        implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
}

tasks.named('test') {
    useJUnitPlatform()
    // 로컬 .env를 자동 로드하더라도 테스트는 실제 외부 서비스에 의존하지 않는다.
    systemProperty 'app.ai.enabled', 'false'
    systemProperty 'tour.api.key', ''
    systemProperty 'weather.api.key', ''
    systemProperty 'congestion.api.key', ''
    systemProperty 'auth.google.client-id', ''
    systemProperty 'auth.google.android-client-id', ''
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
